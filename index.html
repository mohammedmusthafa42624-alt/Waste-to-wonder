<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste to Wonder</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>♻️ Waste to Wonder</h1>
        <p>Turn Waste Into Wonderful Creations!</p>
    </header>

    <main>
        <section class="upload-box">
            <h2>Upload Your Waste Object</h2>

            <input
                type="file"
                id="wasteImage"
                accept="image/*"
                onchange="previewImage(event)"
            >

            <img id="preview" alt="Image Preview">

            <button onclick="identifyObject()">
                Identify Object
            </button>
        </section>

        <section id="result"></section>

        <section id="tutorial"></section>
    </main>

    <footer>
        <p>Waste to Wonder | Reuse • Recycle • Create</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="script.js"></script>

</body>
</html>
